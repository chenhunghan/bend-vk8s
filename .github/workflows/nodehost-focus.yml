name: nodehost-focus

# A focused lane while the shared layer store in the node host is built
# (feat/layers-nodehost): only the two node-host tests, on amd64 with
# real KVM, when the head commit message says [nodehost]. It builds as
# kvm-smoke does (.github/workflows/ci.yml). Removed before the branch
# is handed over.
on:
  push:
    branches: ['feat/layers-nodehost']

concurrency:
  group: nodehost-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodehost:
    if: contains(github.event.head_commit.message, '[nodehost]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BEND_VERSION: 2.0.40
      BEND_NO_TELEMETRY: "1"
      ARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - name: /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          ls -l /dev/kvm
          test -w /dev/kvm || { echo "::error::no writable /dev/kvm"; exit 1; }
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libx11-dev squashfs-tools e2fsprogs netcat-openbsd zstd >/dev/null
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-amd64-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: scripts/guest/fetch-assets.sh
      - name: Build the guest assets (scripts/guest/build.sh)
        run: VK8S_ASSETS="$HOME/.vk8s/assets/dev" scripts/guest/build.sh
      - name: Build the host binary (scripts/build-linux.sh)
        run: scripts/build-linux.sh out/vk8s
      - name: kubectl
        run: command -v kubectl || echo "$PWD/out/assets/v1.36.6-amd64/bin" >> "$GITHUB_PATH"
      - name: Shared layer store in the node host (tests/nodehost_layers.sh)
        run: tests/nodehost_layers.sh out/vk8s "$HOME/.vk8s/assets/dev" "$(command -v kubectl)"
      - name: Node-host smoke (tests/nodehost_smoke.sh)
        if: always()
        run: tests/nodehost_smoke.sh out/vk8s "$HOME/.vk8s/assets/dev" "$(command -v kubectl)"
