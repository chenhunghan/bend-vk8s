name: check

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Gate
        run: scripts/check.sh
      - name: TLS server (tests/tls_server.sh)
        run: tests/tls_server.sh
      - name: Binary file effects (tests/bin_file.sh)
        run: tests/bin_file.sh
      - name: Install squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools >/dev/null
      - name: Guest image split (tests/guest_image.sh)
        run: tests/guest_image.sh
      - name: Dev VM flags (tests/dev_vm_flags.sh)
        run: tests/dev_vm_flags.sh
      - name: Laws are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          # Every line of every existing law file must survive, and no
          # laws/done marker may go: removals or edits fail the build.
          removed=$(git diff "origin/$GITHUB_BASE_REF"...HEAD -- laws | grep '^-[^-]' || true)
          if [ -n "$removed" ]; then echo "laws/ lines removed or changed:"; echo "$removed"; exit 1; fi
          frozen=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- tests | while read -r f; do git show "origin/$GITHUB_BASE_REF:$f" 2>/dev/null | grep -l 'FROZEN SPEC' >/dev/null && echo "$f"; done)
          if [ -n "$frozen" ]; then echo "frozen tests changed: $frozen"; exit 1; fi

  container-runc:
    # The node container's config.json (src/guest/container.bend) started
    # with runc over busybox, with PID 1's cgroup v2 delegation
    # (tests/container_runc.sh). runc is only the test's harness.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install runc and a static busybox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static >/dev/null
          command -v runc >/dev/null || sudo apt-get install -y -qq runc >/dev/null
      - name: runc smoke (tests/container_runc.sh)
        run: tests/container_runc.sh

  syncer-envtest:
    # The classic syncer between two real control planes (tests/syncer_envtest.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: envtest-v1.36.6-v3.5.21
      - name: Syncer envtest
        run: tests/syncer_envtest.sh

  syncer-load-envtest:
    # The classic syncer under the EmptyDir wrapper volumes load
    # (tests/syncer_load_envtest.sh): 50 ConfigMaps, 25 pods mounting all.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: envtest-v1.36.6-v3.5.21
      - name: Syncer load envtest
        run: tests/syncer_load_envtest.sh

  snapshot-store-spike:
    # Store tools for the open-format snapshot (tests/snapshot_store_spike.sh,
    # docs/ref/snapshot-decisions.md): etcdctl/etcdutl on embedded etcd,
    # etcdctl through kine on SQLite. No Bend needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: snapshot-spike-v3.5.21-kine-v0.17.5
      - name: Snapshot store spike
        run: tests/snapshot_store_spike.sh

  snapshot-envtest:
    # The open-format snapshot round trip (tests/snapshot_envtest.sh): the
    # guest's export and restore steps and the host archive code against
    # the spike's pinned etcd and kine.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: snapshot-spike-v3.5.21-kine-v0.17.5
      - name: Snapshot round trip
        run: tests/snapshot_envtest.sh

  verdict:
    # Every done module re-checked by the BendTT kernel, proven sound in Lean.
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-lean-4.34.0
      - name: Install Lean 4.34
        run: |
          [ -x "$HOME/.elan/bin/lean" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verdict
        run: VERDICT=1 scripts/check.sh
      - name: Runtime verdict (pending done marker)
        run: bend proofs/runtime.bend --verdict

  kubelet-envtest:
    # The fake kubelet against a real kube-apiserver (envtest binaries).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Fake kubelet (tests/kubelet_envtest.sh)
        run: tests/kubelet_envtest.sh

  join-envtest:
    # The standalone /node/join server against a real kube-apiserver
    # (envtest binaries): curl | sh with a fake kubeadm.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Join server (tests/join_envtest.sh)
        run: tests/join_envtest.sh

  kernel16k:
    # The guest kernel with 16 KiB pages (scripts/guest/kernel.sh,
    # docs/ref/footprint-decisions.md M5): build it (cached on the script),
    # then boot it under qemu with the real stage 0, module lists, Debian
    # root and Kubernetes binaries, once per VM role with its set disks
    # (tests/kernel16k_boot.sh; footprint-decisions D1). The Image and
    # modules are uploaded for the Mac boot test (VK8S_KERNEL=16k
    # VK8S_KERNEL_DIR=<the unpacked artifact> scripts/guest/build.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - id: kcache
        uses: actions/cache/restore@v4
        with:
          path: out/build/kernel16k
          key: kernel16k-${{ hashFiles('scripts/guest/kernel.sh') }}
      - name: Build the kernel (scripts/guest/kernel.sh)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: time scripts/guest/kernel.sh out/build/kernel16k
      # saved now, so a failing boot test does not cost the next run a build
      - if: steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/build/kernel16k
          key: kernel16k-${{ hashFiles('scripts/guest/kernel.sh') }}
      - name: The kernel
        run: |
          echo "make took $(cat out/build/kernel16k/build-time) s"
          ls -l out/build/kernel16k/Image; ls out/build/kernel16k/lib/modules
          grep -E '^CONFIG_(ARM64_16K_PAGES|PAGE_SIZE_16KB|PAGE_SHIFT|ARM64_VA_BITS|PGTABLE_LEVELS|VIRTIO_BALLOON|PAGE_REPORTING)=' out/build/kernel16k/config
          sha256sum out/build/kernel16k/Image
      - uses: actions/upload-artifact@v4
        with:
          name: kernel16k
          path: out/build/kernel16k
          retention-days: 30
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Install qemu and squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm squashfs-tools >/dev/null
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: scripts/guest/fetch-assets.sh
      - name: Boot each role under qemu (tests/kernel16k_boot.sh)
        run: tests/kernel16k_boot.sh out/build/kernel16k out/assets/v1.36.6/bin

  dev-vm:
    # The Linux dev VM for the Mac (docs/ref/explore-linux-hosts.md phase
    # 8, docs/ref/dev-vm.md): a debootstrap Debian trixie arm64 root with
    # systemd on /dev/vda, a stage-0 initramfs and Alpine's linux-virt
    # kernel (scripts/dev/rootfs.sh), booted under qemu to multi-user and
    # sshd (tests/dev_vm_boot.sh). Only an image that boots is published:
    # the dev-vm artifact (Image, dev.cpio, rootfs.img, SHA256SUMS, KERNEL)
    # that scripts/dev/linux-vm.sh fetches and checks.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install debootstrap, e2fsprogs and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring e2fsprogs qemu-system-arm openssh-client >/dev/null
      - name: Build the image (scripts/dev/rootfs.sh)
        run: time scripts/dev/rootfs.sh out/dev-vm
      - name: The image
        run: |
          ls -l out/dev-vm
          cat out/dev-vm/KERNEL
          echo "SHA256SUMS (pin these in scripts/dev/linux-vm.sh, docs/ref/dev-vm.md):"
          cat out/dev-vm/SHA256SUMS
      - name: Boot under qemu (tests/dev_vm_boot.sh)
        run: tests/dev_vm_boot.sh out/dev-vm
      - uses: actions/upload-artifact@v4
        with:
          name: dev-vm
          path: out/dev-vm
          retention-days: 90

  assets-disk:
    # The squashfs assets disk (docs/GOAL.md section 9,
    # docs/ref/footprint-decisions.md A1) on the default kernel: Alpine's
    # linux-virt with 4 KiB pages (scripts/guest/alpine-kernel.sh), booted
    # under qemu with the real stage 0, module lists, Debian root and
    # Kubernetes binaries (tests/kernel16k_boot.sh with PAGE_SIZE=4096),
    # once per VM role: the base disk, a data disk and the role's set disks
    # (docs/ref/footprint-decisions.md D1). Then the sizes per asset, per
    # set and per role (scripts/guest/sizes.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Install qemu and squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm squashfs-tools >/dev/null
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: scripts/guest/fetch-assets.sh
      - name: Fetch Alpine's linux-virt (scripts/guest/alpine-kernel.sh)
        run: scripts/guest/alpine-kernel.sh out/build/kernel
      - name: Boot each role under qemu (tests/kernel16k_boot.sh, 4 KiB pages)
        run: PAGE_SIZE=4096 tests/kernel16k_boot.sh out/build/kernel out/assets/v1.36.6/bin
      - name: Sizes per asset, per set and per role (scripts/guest/sizes.sh)
        run: scripts/guest/sizes.sh out/assets/v1.36.6/bin

  linux-build:
    # The host binary for Linux (docs/ref/explore-linux-hosts.md Phase 0):
    # scripts/build-linux.sh (Bend to C, then zig cc against glibc 2.34,
    # else native clang), then `vk8s version` and `vk8s --help`. arm64 is
    # the target; x86_64 is a compile check only, which fails until
    # bend-vmm has x86_64 (its host/hvf.c issues arm64 KVM ioctls; D5), so
    # its build step may fail and the summary records the result.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            bend: linux-arm64
            bend_sha: 2f42a6fa34ecdaa71ae105e5fa734f9a07e129d333e45448ab6d2ff03a837570
            compile_only: false
          - runner: ubuntu-latest
            bend: linux-x64
            bend_sha: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
            compile_only: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BEND_VERSION: 2.0.40
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-${{ matrix.bend }}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "${{ matrix.bend_sha }}  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Linux packages
        # bend-vmm's --display effect includes X11/Xlib.h and links libX11;
        # the arm64 runner image has no X11 headers.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev clang
      - name: Toolchain
        run: |
          zig version
          command -v clang && clang --version | head -1 || echo "no clang"
          ldd --version | head -1
      - name: Build (scripts/build-linux.sh)
        id: build
        continue-on-error: ${{ matrix.compile_only }}
        run: |
          set -o pipefail
          scripts/build-linux.sh out/vk8s 2>&1 | tee out-build.log
      - name: Run vk8s version and --help
        if: steps.build.outcome == 'success'
        run: |
          file out/vk8s
          ldd out/vk8s
          echo "highest glibc symbol version: $(objdump -T out/vk8s | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          out/vk8s version
          out/vk8s --help 2>&1 | tee help.txt
          grep -q '^usage: vk8s' help.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### vk8s on ${{ matrix.runner }}: build ${{ steps.build.outcome }}"
            echo '```'
            grep '^build-linux:' out-build.log 2>/dev/null || echo "no build log"
            if [ -x out/vk8s ]; then echo "highest glibc symbol version: $(objdump -T out/vk8s | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^build-linux:' out-build.log 2>/dev/null || true
