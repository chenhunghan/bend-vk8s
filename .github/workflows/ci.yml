name: check

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  # native-certified runs only on a dispatch or on a PR labelled certify
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Gate
        run: scripts/check.sh
      - name: TLS server (tests/tls_server.sh)
        run: tests/tls_server.sh
      - name: Binary file effects (tests/bin_file.sh)
        run: tests/bin_file.sh
      - name: OCI blob effects, 5 GiB plain and TLS (tests/oci_blob.sh)
        run: tests/oci_blob.sh
      - name: Install squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools >/dev/null
      - name: Guest image split (tests/guest_image.sh)
        run: tests/guest_image.sh
      - name: Dev VM flags (tests/dev_vm_flags.sh)
        run: tests/dev_vm_flags.sh
      - name: Laws are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          # Every line of every existing law file must survive, and no
          # laws/done marker may go: removals or edits fail the build.
          removed=$(git diff "origin/$GITHUB_BASE_REF"...HEAD -- laws | grep '^-[^-]' || true)
          if [ -n "$removed" ]; then echo "laws/ lines removed or changed:"; echo "$removed"; exit 1; fi
          frozen=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- tests | while read -r f; do git show "origin/$GITHUB_BASE_REF:$f" 2>/dev/null | grep -l 'FROZEN SPEC' >/dev/null && echo "$f"; done)
          if [ -n "$frozen" ]; then echo "frozen tests changed: $frozen"; exit 1; fi

  oci-blob-macos:
    # The OCI blob effects (host/oci/effs/oci_blob.c) are portable C: they
    # build on macOS, and the native program runs there (OciBlob.create in
    # a missing directory answers ENOENT). tests/oci_blob.sh runs them end to end
    # on Linux, in the check job.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_DARWIN_ARM64: b2be003b041eb6cfc65326be18f79eb2e0bae2189be79a18c507e661b4b6900b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-darwin-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_DARWIN_ARM64  /tmp/$name" | shasum -a 256 -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Build and run tests/oci_blob_echo.bend natively
        run: |
          bend tests/oci_blob_echo.bend -o "$RUNNER_TEMP/oci_blob_echo"
          out=$("$RUNNER_TEMP/oci_blob_echo")
          echo "$out"
          grep -qx 'PASS oci_blob_echo: OciBlob.create in a missing directory answers ENOENT (native lane)' <<<"$out"

  container-runc:
    # The node container's config.json (src/guest/container.bend) started
    # with runc over busybox, with PID 1's cgroup v2 delegation
    # (tests/container_runc.sh). runc is only the test's harness.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install runc and a static busybox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static >/dev/null
          command -v runc >/dev/null || sudo apt-get install -y -qq runc >/dev/null
      - name: runc smoke (tests/container_runc.sh)
        run: tests/container_runc.sh

  container-smoke:
    # Container mode end to end (docs/ref/explore-linux-hosts.md Phase 6
    # C2): the guest assets (scripts/guest/build.sh) and the host binary
    # (scripts/build-linux.sh) built here, then tests/container_smoke.sh:
    # vk8s create --backend container with a worker, both nodes Ready, a
    # pod Running, vk8s delete, nothing left on the host. Each entry
    # builds its own arch's assets (ARCH, scripts/guest/fetch-assets.sh)
    # and needs no KVM: the nodes are runc containers on the host kernel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
            bend: linux-arm64
            bend_sha: 2f42a6fa34ecdaa71ae105e5fa734f9a07e129d333e45448ab6d2ff03a837570
            sfx: ""
          - runner: ubuntu-latest
            arch: amd64
            bend: linux-x64
            bend_sha: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
            sfx: -amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BEND_VERSION: 2.0.40
      BEND_NO_TELEMETRY: "1"
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-${{ matrix.bend }}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "${{ matrix.bend_sha }}  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Linux packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev clang squashfs-tools e2fsprogs cpio runc busybox-static iproute2 iptables zstd >/dev/null
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-${{ matrix.arch }}-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: scripts/guest/fetch-assets.sh
      - name: Build the guest assets (scripts/guest/build.sh)
        run: BUSYBOX_BIN=/bin/busybox VK8S_ASSETS="$PWD/out/install" scripts/guest/build.sh
      - name: Build the host binary (scripts/build-linux.sh)
        run: scripts/build-linux.sh out/vk8s
      - name: Pack the build for container-regression
        run: |
          # GNU tar -S keeps the sparse data.img sparse
          mkdir -p out/ctr-build
          tar -C out -cSf - install | zstd -q -T0 -3 -o out/ctr-build/install.tar.zst
          cp out/vk8s out/ctr-build/vk8s
          cp out/assets/v1.36.6${{ matrix.sfx }}/bin/kubectl out/ctr-build/kubectl
          ls -l out/ctr-build
      - uses: actions/upload-artifact@v4
        with:
          name: ctr-build-${{ matrix.arch }}
          path: out/ctr-build
          compression-level: 0
          retention-days: 3
      - name: Container smoke (tests/container_smoke.sh)
        run: tests/container_smoke.sh out/vk8s out/install out/assets/v1.36.6${{ matrix.sfx }}/bin/kubectl
      - name: Sleep when idle (tests/idle_sleep_smoke.sh)
        run: tests/idle_sleep_smoke.sh out/vk8s out/install out/assets/v1.36.6${{ matrix.sfx }}/bin/kubectl

  container-regression:
    # The focused conformance subset (scripts/regression.sh, focus list
    # scripts/regression-focus.txt) in container mode on Linux, one runner
    # per arch: VK8S_BACKEND=container MODES=standalone creates st
    # (--backing-store etcd, 2 workers) as runc containers on the host
    # kernel (no KVM). Classic mode is not run: --backend container has no
    # --host-kubeconfig. It reuses container-smoke's build of its arch
    # (artifact ctr-build-<arch>: out/vk8s, the guest assets, kubectl).
    needs: container-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
            sono_sha: ec482b5d1ec237f4c94b6fd7be5a69f95678a4331001b3edcb6ad7835ec40695
          - runner: ubuntu-latest
            arch: amd64
            sono_sha: 7c5c2250e5103c98f4dad2bcab86baf954e319c57c419c113f28f5060e62f129
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      SONOBUOY_VERSION: 0.57.5
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio runc iproute2 iptables zstd >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: ctr-build-${{ matrix.arch }}
          path: out/ctr-build
      - name: Unpack the build
        run: |
          zstd -q -d -c out/ctr-build/install.tar.zst | tar -C out -xSf -
          install -m 755 out/ctr-build/vk8s out/vk8s
          mkdir -p out/bin
          install -m 755 out/ctr-build/kubectl out/bin/kubectl
          rm -rf out/ctr-build
          echo "$PWD/out/bin" >> "$GITHUB_PATH"
          echo "VK8S_ASSETS=$PWD/out/install" >> "$GITHUB_ENV"
          ls -ls out/install
          out/vk8s version
          df -h "$HOME" /tmp
          free -g
      - name: sonobuoy
        run: |
          name="sonobuoy_${SONOBUOY_VERSION}_linux_${{ matrix.arch }}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/vmware-tanzu/sonobuoy/releases/download/v$SONOBUOY_VERSION/$name"
          echo "${{ matrix.sono_sha }}  /tmp/$name" | sha256sum -c -
          mkdir -p out/tools
          tar -xzf "/tmp/$name" -C out/tools sonobuoy
          out/tools/sonobuoy version --short
          kubectl version --client
      - name: Regression (scripts/regression.sh, container backend, standalone)
        env:
          MODES: standalone
          VK8S_BACKEND: container
        # the script starts itself again under sudo (container mode needs root)
        run: time scripts/regression.sh
      - name: Logs of the cluster nodes
        if: failure()
        run: |
          for f in "$HOME"/.vk8s/clusters/*/console.log "$HOME"/.vk8s/clusters/*/nodes/*/console.log "$HOME"/.vk8s/clusters/*/share/logs/*.log; do
            sudo test -f "$f" || continue
            echo "== $f (last 80 lines)"; sudo tail -n 80 "$f"
          done
          sudo runc --root /run/vk8s/runc list || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-container-${{ matrix.arch }}
          path: |
            out/*_sonobuoy_*.tar.gz
            out/reg-*.log
            out/reg-*.results
            out/reg-*.sum
          if-no-files-found: warn

  syncer-envtest:
    # The classic syncer between two real control planes (tests/syncer_envtest.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: envtest-v1.36.6-v3.5.21
      - name: Syncer envtest
        run: tests/syncer_envtest.sh

  syncer-load-envtest:
    # The classic syncer under the EmptyDir wrapper volumes load
    # (tests/syncer_load_envtest.sh): 50 ConfigMaps, 25 pods mounting all.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: envtest-v1.36.6-v3.5.21
      - name: Syncer load envtest
        run: tests/syncer_load_envtest.sh

  snapshot-store-spike:
    # Store tools for the open-format snapshot (tests/snapshot_store_spike.sh,
    # docs/ref/snapshot-decisions.md): etcdctl/etcdutl on embedded etcd,
    # etcdctl through kine on SQLite. No Bend needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: snapshot-spike-v3.5.21-kine-v0.17.5
      - name: Snapshot store spike
        run: tests/snapshot_store_spike.sh

  snapshot-envtest:
    # The open-format snapshot round trip (tests/snapshot_envtest.sh): the
    # guest's export and restore steps and the host archive code against
    # the spike's pinned etcd and kine.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vk8s-envtest
          key: snapshot-spike-v3.5.21-kine-v0.17.5
      - name: Snapshot round trip
        run: tests/snapshot_envtest.sh

  verdict:
    # Every done module re-checked by the BendTT kernel, proven sound in Lean.
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-lean-4.34.0
      - name: Install Lean 4.34
        run: |
          [ -x "$HOME/.elan/bin/lean" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verdict
        run: VERDICT=1 scripts/check.sh
      - name: Runtime verdict (pending done marker)
        run: bend proofs/runtime.bend --verdict
      - name: Container host and backend verdict (pending done markers)
        run: |
          bend proofs/container_host.bend --verdict
          bend proofs/backend.bend --verdict
          bend proofs/ctr.bend --verdict

  kubelet-envtest:
    # The fake kubelet against a real kube-apiserver (envtest binaries).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Fake kubelet (tests/kubelet_envtest.sh)
        run: tests/kubelet_envtest.sh

  join-envtest:
    # The standalone /node/join server against a real kube-apiserver
    # (envtest binaries): curl | sh with a fake kubeadm.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Join server (tests/join_envtest.sh)
        run: tests/join_envtest.sh

  native-envtest:
    # Native mode (docs/ref/explore-linux-hosts.md Phase 5, N1 and N2):
    # the reduced native plan (Native.smoke) as a normal process on the
    # runner, then SIGTERM: the runner stops only its own daemons, last
    # started first, and leaves no stray process (tests/native_envtest.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Native smoke plan and shutdown (tests/native_envtest.sh)
        run: tests/native_envtest.sh

  native-smoke:
    # Native mode end to end (docs/ref/native-host.md; explore-linux-hosts
    # Phase 5, N3 to N5): `vk8s create demo --backend native` installs the
    # systemd unit vk8s-demo.service (sudo, each step printed), the API
    # answers, the host node is Ready and a pod runs; a second cluster runs
    # beside it on its own ports; token create serves the installing join
    # script; delete leaves no unit, dir, mount, cgroup, rule, link or
    # process (tests/native_smoke.sh). ubuntu-latest has systemd and
    # passwordless sudo. The assets are the native backend's inputs only:
    # the node and control-plane role sets (scripts/guest/mksets.sh) and a
    # vk8s.cpio holding busybox and flannel's manifest
    # (scripts/guest/mkinitramfs.py), from the pinned Kubernetes binaries.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_X64: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      BEND_NO_TELEMETRY: "1"
      ARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libx11-dev squashfs-tools cpio busybox-static zstd >/dev/null
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-amd64-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: time scripts/guest/fetch-assets.sh
      - name: Build the host binary (scripts/build-linux.sh)
        run: |
          time scripts/build-linux.sh out/vk8s
          out/vk8s version
      - name: The native assets (role sets, busybox, flannel's manifest)
        run: |
          a="$HOME/.vk8s/assets/native-ci"
          time scripts/guest/mksets.sh out/assets/v1.36.6-amd64/bin "$a"
          mkdir -p out/build/empty-root
          python3 scripts/guest/mkinitramfs.py "$a/vk8s.cpio" out/build/empty-root \
            "scripts/guest/flannel.yaml:/etc/vk8s/flannel.yaml" "$(command -v busybox):/bin/busybox"
          ls -l "$a"
          echo "VK8S_ASSETS=$a" >> "$GITHUB_ENV"
          command -v kubectl || echo "$PWD/out/assets/v1.36.6-amd64/bin" >> "$GITHUB_PATH"
      - name: Pack the build for native-regression
        run: |
          mkdir -p out/native-build
          tar -C "$HOME/.vk8s/assets" -cf - native-ci | zstd -q -T0 -3 -o out/native-build/assets.tar.zst
          cp out/vk8s out/native-build/vk8s
          cp out/assets/v1.36.6-amd64/bin/kubectl out/native-build/kubectl
          ls -l out/native-build
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-amd64
          path: out/native-build
          compression-level: 0
          retention-days: 3
      - name: Native smoke (tests/native_smoke.sh)
        run: tests/native_smoke.sh

  native-regression:
    # The focused conformance subset (scripts/regression.sh, focus list
    # scripts/regression-focus.txt) on a native standalone cluster:
    # VK8S_VK8S_BACKEND=native MODES=standalone, one host node (no worker VMs) with
    # an etcd backing store, on ubuntu-latest (systemd, passwordless sudo,
    # no KVM needed). This is the evidence that native can become the
    # effective default on Linux. It reuses native-smoke's build (artifact
    # native-build-amd64: out/vk8s, kubectl and the native assets).
    needs: native-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SONOBUOY_VERSION: 0.57.5
      SONOBUOY_SHA_LINUX_AMD64: 7c5c2250e5103c98f4dad2bcab86baf954e319c57c419c113f28f5060e62f129
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: native-build-amd64
          path: out/native-build
      - name: Unpack the build
        run: |
          mkdir -p "$HOME/.vk8s/assets" out/bin
          zstd -q -d -c out/native-build/assets.tar.zst | tar -C "$HOME/.vk8s/assets" -xf -
          install -m 755 out/native-build/vk8s out/vk8s
          install -m 755 out/native-build/kubectl out/bin/kubectl
          rm -rf out/native-build
          echo "VK8S_ASSETS=$HOME/.vk8s/assets/native-ci" >> "$GITHUB_ENV"
          command -v kubectl || echo "$PWD/out/bin" >> "$GITHUB_PATH"
          out/vk8s version
          df -h "$HOME" /tmp
          free -g
      - name: sonobuoy
        run: |
          name="sonobuoy_${SONOBUOY_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/vmware-tanzu/sonobuoy/releases/download/v$SONOBUOY_VERSION/$name"
          echo "$SONOBUOY_SHA_LINUX_AMD64  /tmp/$name" | sha256sum -c -
          mkdir -p out/tools
          tar -xzf "/tmp/$name" -C out/tools sonobuoy
          out/tools/sonobuoy version --short
          kubectl version --client
      # A fresh runner: what the native preflight asks for (native-smoke
      # runs the commands its preflight prints; this job does not).
      - name: Host prerequisites for --backend native
        run: |
          sudo modprobe -a overlay br_netfilter
          sudo sysctl -w net.ipv4.ip_forward=1 net.bridge.bridge-nf-call-iptables=1
      - name: Regression (scripts/regression.sh, native standalone)
        env:
          VK8S_BACKEND: native
          MODES: standalone
        run: time scripts/regression.sh
      - name: Logs of the native cluster
        if: failure()
        run: |
          sudo systemctl status 'vk8s-*' --no-pager -l || true
          for u in $(systemctl list-units 'vk8s-*' --all --plain --no-legend | awk '{print $1}'); do
            echo "== journal of $u (last 200 lines)"; sudo journalctl -u "$u" --no-pager -n 200 || true
          done
      - name: Delete the native cluster
        if: always()
        run: out/vk8s delete st || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-native-standalone-amd64
          path: |
            out/*_sonobuoy_*.tar.gz
            out/reg-*.log
            out/reg-*.results
            out/reg-*.sum
          if-no-files-found: warn

  native-certified:
    # The certified conformance run (sonobuoy certified-conformance:
    # every [Conformance] test, Serial and Disruptive included) on a native
    # standalone cluster, GOAL section 8's last native step after the
    # regression subset. 1.5 to 3 h, so it runs only on a workflow_dispatch
    # or on a pull request that carries the label certify (each push to
    # it). Same build as native-regression (native-smoke's artifact
    # native-build-amd64) and the same cluster (the host node, etcd), plus
    # a second node joined by the cluster's installing join script into an
    # isolated systemd container on the runner (scripts/native-worker.sh),
    # so the two tests that assert two schedulable untainted nodes run:
    # nothing is skipped, the run is the plain certified-conformance mode.
    # scripts/conformance.sh writes the counts to the job summary and fails
    # on any failure.
    needs: native-smoke
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'certify')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SONOBUOY_VERSION: 0.57.5
      SONOBUOY_SHA_LINUX_AMD64: 7c5c2250e5103c98f4dad2bcab86baf954e319c57c419c113f28f5060e62f129
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: native-build-amd64
          path: out/native-build
      - name: Unpack the build
        run: |
          mkdir -p "$HOME/.vk8s/assets" out/bin
          zstd -q -d -c out/native-build/assets.tar.zst | tar -C "$HOME/.vk8s/assets" -xf -
          install -m 755 out/native-build/vk8s out/vk8s
          install -m 755 out/native-build/kubectl out/bin/kubectl
          rm -rf out/native-build
          echo "VK8S_ASSETS=$HOME/.vk8s/assets/native-ci" >> "$GITHUB_ENV"
          command -v kubectl || echo "$PWD/out/bin" >> "$GITHUB_PATH"
          out/vk8s version
          df -h "$HOME" /tmp
          free -g
          nproc
      - name: sonobuoy
        run: |
          name="sonobuoy_${SONOBUOY_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/vmware-tanzu/sonobuoy/releases/download/v$SONOBUOY_VERSION/$name"
          echo "$SONOBUOY_SHA_LINUX_AMD64  /tmp/$name" | sha256sum -c -
          mkdir -p out/tools
          tar -xzf "/tmp/$name" -C out/tools sonobuoy
          out/tools/sonobuoy version --short
          kubectl version --client
      - name: Host prerequisites for --backend native
        run: |
          sudo modprobe -a overlay br_netfilter
          sudo sysctl -w net.ipv4.ip_forward=1 net.bridge.bridge-nf-call-iptables=1
      - name: Create the native cluster
        run: |
          out/vk8s delete cert >/dev/null 2>&1 || true
          time out/vk8s create cert --backend native --backing-store etcd --connect=false 2>&1 | tee out/cert-create.log
          KUBECONFIG="$HOME/.vk8s/clusters/cert/kubeconfig.yaml" kubectl get nodes -o wide
      # daemon_set.go:451 asserts "at least 2 nodes" and
      # architecture/conformance.go "at least two untainted nodes"
      - name: Join a second node (scripts/native-worker.sh)
        # pipefail: a failed join must fail the step, not hide behind tee
        shell: bash
        run: |
          docker version --format 'docker {{.Server.Version}}'
          time scripts/native-worker.sh up cert cert-w1 2>&1 | tee out/cert-worker.log
      - name: Certified conformance (scripts/conformance.sh)
        env:
          SONOBUOY_WAIT: "320"
        run: time scripts/conformance.sh certified-conformance cert
      - name: Logs of the native cluster
        if: failure()
        run: |
          KUBECONFIG="$HOME/.vk8s/clusters/cert/kubeconfig.yaml" kubectl get nodes -o wide || true
          KUBECONFIG="$HOME/.vk8s/clusters/cert/kubeconfig.yaml" kubectl get pods -A -o wide || true
          sudo systemctl status 'vk8s-*' --no-pager -l || true
          for u in $(systemctl list-units 'vk8s-*' --all --plain --no-legend | awk '{print $1}'); do
            echo "== journal of $u (last 200 lines)"; sudo journalctl -u "$u" --no-pager -n 200 || true
          done
          ip route; ip rule; sudo ip route show table 177 || true
          for u in vk8s-containerd kubelet; do
            echo "== journal of $u in cert-w1 (last 200 lines)"; docker exec cert-w1 journalctl -u "$u" --no-pager -n 200 || true
          done
          docker logs --tail 100 cert-w1 || true
      - name: Remove the second node
        if: always()
        run: scripts/native-worker.sh down cert cert-w1 || true
      - name: Delete the native cluster
        if: always()
        run: out/vk8s delete cert || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certified-native-standalone-amd64
          path: |
            out/conformance/*_sonobuoy_*.tar.gz
            out/conformance/results.txt
            out/cert-create.log
            out/cert-worker.log
          if-no-files-found: warn

  kernel16k:
    # The guest kernel with 16 KiB pages (scripts/guest/kernel.sh,
    # docs/ref/footprint-decisions.md M5): build it (cached on the script),
    # then boot it under qemu with the real stage 0, module lists, Debian
    # root and Kubernetes binaries, once per VM role with its set disks
    # (tests/kernel16k_boot.sh; footprint-decisions D1). The Image and
    # modules are uploaded for the Mac boot test (VK8S_KERNEL=16k
    # VK8S_KERNEL_DIR=<the unpacked artifact> scripts/guest/build.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - id: kcache
        uses: actions/cache/restore@v4
        with:
          path: out/build/kernel16k
          key: kernel16k-${{ hashFiles('scripts/guest/kernel.sh') }}
      - name: Build the kernel (scripts/guest/kernel.sh)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: time scripts/guest/kernel.sh out/build/kernel16k
      # saved now, so a failing boot test does not cost the next run a build
      - if: steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/build/kernel16k
          key: kernel16k-${{ hashFiles('scripts/guest/kernel.sh') }}
      - name: The kernel
        run: |
          echo "make took $(cat out/build/kernel16k/build-time) s"
          ls -l out/build/kernel16k/Image; ls out/build/kernel16k/lib/modules
          grep -E '^CONFIG_(ARM64_16K_PAGES|PAGE_SIZE_16KB|PAGE_SHIFT|ARM64_VA_BITS|PGTABLE_LEVELS|VIRTIO_BALLOON|PAGE_REPORTING)=' out/build/kernel16k/config
          sha256sum out/build/kernel16k/Image
      - uses: actions/upload-artifact@v4
        with:
          name: kernel16k
          path: out/build/kernel16k
          retention-days: 30
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Install qemu and squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm squashfs-tools >/dev/null
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: scripts/guest/fetch-assets.sh
      - name: Boot each role under qemu (tests/kernel16k_boot.sh)
        run: tests/kernel16k_boot.sh out/build/kernel16k out/assets/v1.36.6/bin

  dev-vm:
    # The Linux dev VM for the Mac (docs/ref/explore-linux-hosts.md phase
    # 8, docs/ref/dev-vm.md): a debootstrap Debian trixie arm64 root with
    # systemd on /dev/vda, a stage-0 initramfs and Alpine's linux-virt
    # kernel (scripts/dev/rootfs.sh), booted under qemu to multi-user and
    # sshd (tests/dev_vm_boot.sh). Only an image that boots is published:
    # the dev-vm artifact (Image, dev.cpio, rootfs.img, SHA256SUMS, KERNEL)
    # that scripts/dev/linux-vm.sh fetches and checks.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install debootstrap, e2fsprogs and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring e2fsprogs qemu-system-arm openssh-client >/dev/null
      - name: Build the image (scripts/dev/rootfs.sh)
        run: time scripts/dev/rootfs.sh out/dev-vm
      - name: The image
        run: |
          ls -l out/dev-vm
          cat out/dev-vm/KERNEL
          echo "SHA256SUMS (pin these in scripts/dev/linux-vm.sh, docs/ref/dev-vm.md):"
          cat out/dev-vm/SHA256SUMS
      - name: Boot under qemu (tests/dev_vm_boot.sh)
        run: tests/dev_vm_boot.sh out/dev-vm
      - uses: actions/upload-artifact@v4
        with:
          name: dev-vm
          path: out/dev-vm
          retention-days: 90

  assets-disk:
    # The squashfs assets disk (docs/GOAL.md section 9,
    # docs/ref/footprint-decisions.md A1) on the default kernel: Alpine's
    # linux-virt with 4 KiB pages (scripts/guest/alpine-kernel.sh), booted
    # under qemu with the real stage 0, module lists, Debian root and
    # Kubernetes binaries (tests/kernel16k_boot.sh with PAGE_SIZE=4096),
    # once per VM role: the base disk, a data disk and the role's set disks
    # (docs/ref/footprint-decisions.md D1). Role gvisor (docs/GOAL.md
    # section 8) boots a node from the rendered boot plan and runs a pod
    # with runtimeClassName: gvisor, whose dmesg must be gVisor's. Then the
    # sizes per asset, per set and per role (scripts/guest/sizes.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA_LINUX_ARM64: 2f42a6fa34ecdaa71ae105e5fa734f9a07e129d333e45448ab6d2ff03a837570
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend (tests/gvisor_boot.bend renders the gVisor boot plan)
        run: |
          name="bend-$BEND_VERSION-linux-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_ARM64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Install qemu and squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm squashfs-tools clang >/dev/null
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        run: scripts/guest/fetch-assets.sh
      - name: Fetch Alpine's linux-virt (scripts/guest/alpine-kernel.sh)
        run: scripts/guest/alpine-kernel.sh out/build/kernel
      - name: Boot each role under qemu, and the gVisor pod (tests/kernel16k_boot.sh, 4 KiB pages)
        run: PAGE_SIZE=4096 ROLES="standalone classic worker cache gvisor" tests/kernel16k_boot.sh out/build/kernel out/assets/v1.36.6/bin
      - name: Sizes per asset, per set and per role (scripts/guest/sizes.sh)
        run: scripts/guest/sizes.sh out/assets/v1.36.6/bin

  linux-build:
    # The host binary for Linux (docs/ref/explore-linux-hosts.md Phase 0):
    # scripts/build-linux.sh (Bend to C, then zig cc against glibc 2.34,
    # else native clang), then `vk8s version` and `vk8s --help`, on arm64
    # and x86_64 (bend-vmm 0x81011db9, 7a9010c, runs x86_64 guests on KVM).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            bend: linux-arm64
            bend_sha: 2f42a6fa34ecdaa71ae105e5fa734f9a07e129d333e45448ab6d2ff03a837570
            compile_only: false
          - runner: ubuntu-latest
            bend: linux-x64
            bend_sha: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
            compile_only: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BEND_VERSION: 2.0.40
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-${{ matrix.bend }}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "${{ matrix.bend_sha }}  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Linux packages
        # bend-vmm's --display effect includes X11/Xlib.h and links libX11;
        # the arm64 runner image has no X11 headers.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev clang
      - name: Toolchain
        run: |
          zig version
          command -v clang && clang --version | head -1 || echo "no clang"
          ldd --version | head -1
      - name: Build (scripts/build-linux.sh)
        id: build
        continue-on-error: ${{ matrix.compile_only }}
        run: |
          set -o pipefail
          scripts/build-linux.sh out/vk8s 2>&1 | tee out-build.log
      - name: Run vk8s version and --help
        if: steps.build.outcome == 'success'
        run: |
          file out/vk8s
          ldd out/vk8s
          echo "highest glibc symbol version: $(objdump -T out/vk8s | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          out/vk8s version
          out/vk8s --help 2>&1 | tee help.txt
          grep -q '^usage: vk8s' help.txt
      - name: No libX11 at load time; keep the binary for the release
        if: steps.build.outcome == 'success'
        run: |
          ! ldd out/vk8s | grep -q libX11
          mkdir -p out/release-bin && cp out/vk8s out/release-bin/vk8s
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: vk8s-linux-${{ matrix.runner }}
          path: out/release-bin
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo "### vk8s on ${{ matrix.runner }}: build ${{ steps.build.outcome }}"
            echo '```'
            grep '^build-linux:' out-build.log 2>/dev/null || echo "no build log"
            if [ -x out/vk8s ]; then echo "highest glibc symbol version: $(objdump -T out/vk8s | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^build-linux:' out-build.log 2>/dev/null || true

  kvm-smoke:
    # The VM backend end to end on real KVM (docs/ref/explore-linux-hosts.md
    # Phases 2 and 3): the arch's guest assets from their pinned inputs
    # (scripts/guest/fetch-assets.sh, scripts/guest/build.sh), the host
    # binary (scripts/build-linux.sh), then scripts/smoke-linux.sh (create
    # with a worker, nodes Ready, a pod Running, a pod on the worker with
    # runtimeClassName: gvisor whose dmesg is gVisor's, snapshot, delete,
    # restore, delete, nothing left). GitHub's x86_64 runners have KVM once a udev
    # rule opens /dev/kvm (as GitHub's changelog and the Android emulator
    # runner document). The amd64 job pins ubuntu-24.04, the image
    # bend-vmm's x86 job gets a writable /dev/kvm on; on ubuntu-latest
    # (now ubuntu-26.04) the same rule left /dev/kvm unwritable. `udevadm
    # settle` waits for the rule before the check. Its hosted arm64 runners have no /dev/kvm
    # (runner-images #14062), so the arm64 job probes `test -w /dev/kvm`
    # and skips with a notice when it is missing; on a runner with KVM it
    # runs the same steps.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            bend: linux-x64
            bend_sha: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
            need_kvm: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            bend: linux-arm64
            bend_sha: 2f42a6fa34ecdaa71ae105e5fa734f9a07e129d333e45448ab6d2ff03a837570
            need_kvm: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BEND_VERSION: 2.0.40
      BEND_NO_TELEMETRY: "1"
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: /dev/kvm
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          ls -l /dev/kvm || true
          if test -w /dev/kvm; then
            ls -l /dev/kvm
            echo "kvm=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.need_kvm }}" = true ]; then
            echo "::error::${{ matrix.runner }} has no writable /dev/kvm"
            exit 1
          else
            msg="SKIPPED: ${{ matrix.runner }} has no /dev/kvm (GitHub's hosted arm64 runners have no nested KVM); the ${{ matrix.arch }} KVM smoke needs a runner with KVM"
            echo "::notice::$msg"
            echo "### vk8s smoke on ${{ matrix.arch }}: $msg" >> "$GITHUB_STEP_SUMMARY"
            echo "kvm=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Bend
        if: steps.kvm.outputs.kvm == 'true'
        run: |
          name="bend-$BEND_VERSION-${{ matrix.bend }}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "${{ matrix.bend_sha }}  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - if: steps.kvm.outputs.kvm == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Linux packages
        if: steps.kvm.outputs.kvm == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libx11-dev squashfs-tools e2fsprogs netcat-openbsd zstd >/dev/null
      - if: steps.kvm.outputs.kvm == 'true'
        uses: actions/cache@v4
        with:
          path: out/assets
          key: assets-${{ matrix.arch }}-${{ hashFiles('scripts/guest/fetch-assets.sh') }}
      - name: Fetch the Kubernetes binaries (scripts/guest/fetch-assets.sh)
        if: steps.kvm.outputs.kvm == 'true'
        run: time scripts/guest/fetch-assets.sh
      - name: Build the guest assets (scripts/guest/build.sh)
        if: steps.kvm.outputs.kvm == 'true'
        run: |
          echo "VK8S_ASSETS=$HOME/.vk8s/assets/dev" >> "$GITHUB_ENV"
          time VK8S_ASSETS="$HOME/.vk8s/assets/dev" scripts/guest/build.sh
          ls -l "$HOME/.vk8s/assets/dev"
          file "$HOME/.vk8s/assets/dev/Image"
      - name: Build the host binary (scripts/build-linux.sh)
        if: steps.kvm.outputs.kvm == 'true'
        run: |
          time scripts/build-linux.sh out/vk8s
          out/vk8s version
      - name: kubectl
        if: steps.kvm.outputs.kvm == 'true'
        run: |
          # the runner's, else the one in the fetched bundle (same arch)
          sfx=; [ "$ARCH" = amd64 ] && sfx=-amd64
          command -v kubectl || echo "$PWD/out/assets/v1.36.6$sfx/bin" >> "$GITHUB_PATH"
      - name: Pack the build for kvm-regression
        if: steps.kvm.outputs.kvm == 'true' && matrix.arch == 'amd64'
        run: |
          # GNU tar -S keeps the sparse disks (data.img is 16 GiB) sparse
          mkdir -p out/kvm-build
          tar -C "$HOME/.vk8s/assets" -cSf - dev | zstd -q -T0 -3 -o out/kvm-build/assets.tar.zst
          cp out/vk8s out/kvm-build/vk8s
          ls -l out/kvm-build
      - if: steps.kvm.outputs.kvm == 'true' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: kvm-build-amd64
          path: out/kvm-build
          compression-level: 0
          retention-days: 3
      - name: Smoke (scripts/smoke-linux.sh)
        if: steps.kvm.outputs.kvm == 'true'
        run: scripts/smoke-linux.sh

  nodehost-smoke:
    # Container mode through the node-host VM, the macOS path
    # (docs/ref/explore-linux-hosts.md Phase 6 C4; src/cli/nodehost.bend,
    # host/init.bend role node-host), on amd64 with real KVM:
    # VK8S_NODE_HOST=vm makes `vk8s create --backend container` start the
    # shared node-host VM as on a Mac. tests/nodehost_smoke.sh: two
    # clusters in one node host, nodes Ready, a pod Running, list, pause,
    # resume, delete; the node host stops with the last cluster. It reuses
    # kvm-smoke's amd64 build (artifact kvm-build-amd64).
    needs: kvm-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          ls -l /dev/kvm
          test -w /dev/kvm || { echo "::error::no writable /dev/kvm"; exit 1; }
      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-6 e2fsprogs netcat-openbsd zstd >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: kvm-build-amd64
          path: out/kvm-build
      - name: Unpack the build
        run: |
          mkdir -p "$HOME/.vk8s/assets"
          zstd -q -d -c out/kvm-build/assets.tar.zst | tar -C "$HOME/.vk8s/assets" -xSf -
          install -m 755 out/kvm-build/vk8s out/vk8s
          rm -rf out/kvm-build
          ls -ls "$HOME/.vk8s/assets/dev"
          out/vk8s version
          command -v kubectl && kubectl version --client
      - name: Node-host smoke (tests/nodehost_smoke.sh)
        run: tests/nodehost_smoke.sh out/vk8s "$HOME/.vk8s/assets/dev" "$(command -v kubectl)"

  kvm-regression:
    # The focused conformance subset (scripts/regression.sh, focus list
    # scripts/regression-focus.txt) on amd64 with real KVM, one mode per
    # runner so each fits a hosted runner's 16 GB: standalone (st, 3 VMs of
    # 2 GiB + the 1 GiB image cache) and classic (hc, 3 VMs + vc + the
    # cache). Default VM memory, no --memory. It reuses the amd64 build of
    # kvm-smoke (artifact kvm-build-amd64: out/vk8s and the guest assets).
    needs: kvm-smoke
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, classic]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SONOBUOY_VERSION: 0.57.5
      SONOBUOY_SHA_LINUX_AMD64: 7c5c2250e5103c98f4dad2bcab86baf954e319c57c419c113f28f5060e62f129
    steps:
      - uses: actions/checkout@v4
      - name: /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle || true
          ls -l /dev/kvm
          test -w /dev/kvm || { echo "::error::no writable /dev/kvm"; exit 1; }
      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-6 e2fsprogs netcat-openbsd zstd >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: kvm-build-amd64
          path: out/kvm-build
      - name: Unpack the build
        run: |
          mkdir -p "$HOME/.vk8s/assets"
          zstd -q -d -c out/kvm-build/assets.tar.zst | tar -C "$HOME/.vk8s/assets" -xSf -
          install -m 755 out/kvm-build/vk8s out/vk8s
          rm -rf out/kvm-build
          echo "VK8S_ASSETS=$HOME/.vk8s/assets/dev" >> "$GITHUB_ENV"
          ls -ls "$HOME/.vk8s/assets/dev"
          out/vk8s version
          df -h "$HOME" /tmp
          free -g
      - name: sonobuoy
        run: |
          name="sonobuoy_${SONOBUOY_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/$name" "https://github.com/vmware-tanzu/sonobuoy/releases/download/v$SONOBUOY_VERSION/$name"
          echo "$SONOBUOY_SHA_LINUX_AMD64  /tmp/$name" | sha256sum -c -
          mkdir -p out/tools
          tar -xzf "/tmp/$name" -C out/tools sonobuoy
          out/tools/sonobuoy version --short
          command -v kubectl && kubectl version --client
      - name: Regression (scripts/regression.sh, ${{ matrix.mode }})
        env:
          MODES: ${{ matrix.mode }}
        run: time scripts/regression.sh
      - name: Logs of the cluster VMs
        if: failure()
        run: |
          for f in "$HOME"/.vk8s/clusters/*/console.log "$HOME"/.vk8s/clusters/*/nodes/*/console.log "$HOME"/.vk8s/clusters/*/vmm.log "$HOME"/.vk8s/cache/console.log; do
            [ -f "$f" ] || continue
            echo "== $f (last 80 lines)"; tail -n 80 "$f"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.mode }}-amd64
          path: |
            out/*_sonobuoy_*.tar.gz
            out/reg-*.log
            out/reg-*.results
            out/reg-*.sum
          if-no-files-found: warn
