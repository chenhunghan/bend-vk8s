# flannel v0.28.10 (github.com/flannel-io/flannel kube-flannel.yml), the pod
# network vcluster deploys on private nodes (deploy.cni.flannel), with
# --iface=eth1: the bend-vmm LAN between the cluster's VMs, and the host-gw
# backend: the VMs share that L2 LAN, so pods keep the full 1500 MTU. With
# vxlan (MTU 1450) pod egress through bend-vmm's NAT stalled: the NAT sends
# 1460-byte segments whatever MSS the pod announced.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    k8s-app: flannel
    pod-security.kubernetes.io/enforce: privileged
  name: kube-flannel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: flannel
  name: flannel
  namespace: kube-flannel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: flannel
  name: flannel
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: flannel
  name: flannel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flannel
subjects:
- kind: ServiceAccount
  name: flannel
  namespace: kube-flannel
---
apiVersion: v1
data:
  cni-conf.json: |
    {
      "name": "cbr0",
      "cniVersion": "1.0.0",
      "plugins": [
        {
          "type": "flannel",
          "delegate": {
            "hairpinMode": true,
            "isDefaultGateway": true
          }
        },
        {
          "type": "portmap",
          "capabilities": {
            "portMappings": true
          }
        }
      ]
    }
  net-conf.json: |
    {
      "Network": "10.244.0.0/16",
      "EnableNFTables": false,
      "Backend": {
        "Type": "host-gw"
      }
    }
kind: ConfigMap
metadata:
  labels:
    app: flannel
    k8s-app: flannel
    tier: node
  name: kube-flannel-cfg
  namespace: kube-flannel
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: flannel
    k8s-app: flannel
    tier: node
  name: kube-flannel-ds
  namespace: kube-flannel
spec:
  selector:
    matchLabels:
      app: flannel
      k8s-app: flannel
  template:
    metadata:
      labels:
        app: flannel
        k8s-app: flannel
        tier: node
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - args:
        - --ip-masq
        - --kube-subnet-mgr
        - --iface=eth1
        # vk8s: the CNI config goes into the kubelet's conf dir only once
        # flanneld wrote /run/flannel/subnet.env, which the flannel CNI
        # plugin reads for every sandbox. Upstream's install-cni init
        # container copied it before flanneld ran: the kubelet then
        # reported the node Ready, the first pods (CoreDNS) failed with
        # "failed to load flannel 'subnet.env' file" and waited out the
        # kubelet's pod backoff (13-14 s). The copy is a rename, so
        # containerd never loads half a file; flanneld is the container's
        # process (exec) and gets the kubelet's signals.
        command:
        - /bin/sh
        - -c
        - |
          (until [ -s /run/flannel/subnet.env ]; do sleep 0.2; done
          cp -f /etc/kube-flannel/cni-conf.json /etc/cni/net.d/.10-flannel.conflist.tmp &&
          mv -f /etc/cni/net.d/.10-flannel.conflist.tmp /etc/cni/net.d/10-flannel.conflist) &
          exec /opt/bin/flanneld "$@"
        - flanneld
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: EVENT_QUEUE_DEPTH
          value: "5000"
        - name: CONT_WHEN_CACHE_NOT_READY
          value: "false"
        image: ghcr.io/flannel-io/flannel:v0.28.10
        name: kube-flannel
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
          privileged: false
        volumeMounts:
        - mountPath: /run/flannel
          name: run
        - mountPath: /etc/cni/net.d
          name: cni
        - mountPath: /etc/kube-flannel/
          name: flannel-cfg
        - mountPath: /run/xtables.lock
          name: xtables-lock
      hostNetwork: true
      initContainers:
      - args:
        - -f
        - /flannel
        - /opt/cni/bin/flannel
        command:
        - cp
        image: ghcr.io/flannel-io/flannel-cni-plugin:v1.9.1-flannel3
        name: install-cni-plugin
        volumeMounts:
        - mountPath: /opt/cni/bin
          name: cni-plugin
      # vk8s: in place of upstream's install-cni (see the kube-flannel
      # container, which installs the config after subnet.env). A config
      # left by an earlier boot while subnet.env is gone (/run is a tmpfs:
      # a node reboot) would make the node Ready before a sandbox can be
      # created, so it goes; with subnet.env there (a flannel pod restart,
      # an upgrade of a running node) the working config stays.
      - command:
        - /bin/sh
        - -c
        - '[ -s /run/flannel/subnet.env ] || rm -f /etc/cni/net.d/10-flannel.conflist'
        image: ghcr.io/flannel-io/flannel:v0.28.10
        name: install-cni
        volumeMounts:
        - mountPath: /etc/cni/net.d
          name: cni
        - mountPath: /run/flannel
          name: run
      # vk8s: flanneld (hostNetwork) reaches the API server through
      # kube-proxy's DNAT of $KUBERNETES_SERVICE_HOST. When flanneld
      # starts before kube-proxy wrote that rule (kube-proxy's pod waits
      # out a CreateContainerConfigError "services have not yet been read
      # at least once" retry), its first SYN leaves un-NATed, conntrack
      # keeps that flow without NAT, every retransmit follows it, and
      # flanneld dies on "dial tcp 10.96.0.1:443: i/o timeout" 30 s later.
      # So wait for the rule in nat KUBE-SERVICES (at most 300 s).
      - command:
        - /bin/sh
        - -c
        - |
          n=0
          until iptables -w 5 -t nat -S KUBE-SERVICES 2>/dev/null | grep -q -e "-d $KUBERNETES_SERVICE_HOST/32 "; do
            n=$((n+1)); [ $n -lt 300 ] || { echo "no kube-proxy rule for $KUBERNETES_SERVICE_HOST after $n s"; exit 0; }
            sleep 1
          done
          echo "kube-proxy's rule for $KUBERNETES_SERVICE_HOST after $n s"
        image: ghcr.io/flannel-io/flannel:v0.28.10
        name: wait-kube-proxy
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
          privileged: false
        volumeMounts:
        - mountPath: /run/xtables.lock
          name: xtables-lock
      priorityClassName: system-node-critical
      serviceAccountName: flannel
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - hostPath:
          path: /run/flannel
        name: run
      - hostPath:
          path: /opt/cni/bin
        name: cni-plugin
      - hostPath:
          path: /etc/cni/net.d
        name: cni
      - configMap:
          name: kube-flannel-cfg
        name: flannel-cfg
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock
