# vcluster's conformance profile (test/conformanceValues.yaml) as vk8s runs
# it: the virtual scheduler, every host node synced in with its own
# addresses (proxyKubelets off), and PVs, PriorityClasses and StorageClasses
# synced to the host. One divergence: embedded etcd, since vk8s runs no
# etcd StatefulSet. Real nodes get the vcluster Service's IP as one more
# address (InternalDNS), so the API server's kubelet traffic reaches vk8s's
# fake kubelet (docs/DESIGN.md).
#   vk8s create vc --host-kubeconfig HOST.yaml -f docs/examples/conformance-classic.yaml
controlPlane:
  advanced:
    virtualScheduler:
      enabled: true
  backingStore:
    etcd:
      embedded:
        enabled: true
networking:
  advanced:
    proxyKubelets:
      byHostname: false
      byIP: false
sync:
  fromHost:
    csiDrivers:
      enabled: false
    csiStorageCapacities:
      enabled: false
    nodes:
      enabled: true
      selector:
        all: true
  toHost:
    persistentVolumes:
      enabled: true
    priorityClasses:
      enabled: true
    storageClasses:
      enabled: true
